<!doctype html>
  <html lang="pt-BR">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERP Industrial</title>
  <style>
  :root {
    --bg:#f5f7fb; --panel:#fff; --ink:#0f172a; --muted:#64748b; --border:#e2e8f0;
    --primary:#2563eb; --primary-soft:#dbeafe;
    --green:#059669; --green-soft:#d1fae5;
    --amber:#d97706; --amber-soft:#fef3c7;
    --red:#dc2626; --red-soft:#fee2e2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  .app{display:flex;min-height:100vh}
  aside{width:220px;background:#0f172a;color:#fff;padding:20px 0;flex-shrink:0}
  aside h1{margin:0 20px 24px;font-size:16px}
  aside nav button{display:block;width:100%;text-align:left;background:none;border:none;color:#cbd5e1;padding:10px 20px;cursor:pointer;font-size:14px}
  aside nav button:hover{background:#1e293b;color:#fff}
  aside nav button.active{background:#1e293b;color:#fff;border-left:3px solid var(--primary);padding-left:17px}
  main{flex:1;padding:24px;overflow-x:auto}
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
  .page-head h2{margin:0;font-size:22px}
  .page-head .sub{color:var(--muted);margin-top:4px;font-size:13px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
  .tabs button{background:none;border:none;padding:10px 16px;cursor:pointer;color:var(--muted);font-size:14px;border-bottom:2px solid transparent;font-weight:500}
  .tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
  .card h3{margin:0 0 12px 0;font-size:15px}
  .card .toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding:10px 12px;font-size:12px}
  td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tr.row-low{background:#fff7f7}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted);font-size:12px}
  button.btn{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
  button.btn:hover{background:#1d4ed8}
  button.btn-secondary{background:#fff;color:var(--ink);border:1px solid var(--border)}
  button.btn-secondary:hover{background:#f8fafc}
  button.btn-danger{background:var(--red);color:#fff}
  button.btn-danger:hover{background:#b91c1c}
  button.btn-sm{padding:4px 10px;font-size:12px}
  button.icon{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px 6px;font-size:14px}
  button.icon:hover{color:var(--ink)}
  button.icon.danger:hover{color:var(--red)}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px}
  .stat .stat-label{color:var(--muted);font-size:13px}
  .stat .stat-val{font-size:28px;font-weight:700;margin-top:6px}
  .stat.alert{background:#fff7f7;border-color:var(--red-soft)}
  .stat.alert .stat-val{color:var(--red)}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500}
  .badge-blue{background:var(--primary-soft);color:var(--primary)}
  .badge-green{background:var(--green-soft);color:var(--green)}
  .badge-amber{background:var(--amber-soft);color:var(--amber)}
  .badge-red{background:var(--red-soft);color:var(--red)}
  .bar{display:inline-block;width:160px;height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;vertical-align:middle;margin-right:8px}
  .bar-fill{height:100%}
  .bar-green{background:var(--green)}
  .bar-amber{background:var(--amber)}
  .bar-red{background:var(--red)}
  input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
  .search{max-width:300px}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:10px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto}
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .modal-head h3{margin:0;font-size:16px}
  .modal-body{padding:20px}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
  .field{margin-bottom:14px}
  .field label{display:block;margin-bottom:6px;font-weight:500;font-size:13px}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .toast-wrap{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
  .toast{background:#0f172a;color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 16px rgba(0,0,0,.18);animation:slideIn .2s ease-out}
  .toast.success{background:var(--green)}
  .toast.error{background:var(--red)}
  @keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  .footer-bar{padding:8px 20px;color:var(--muted);font-size:11px;border-top:1px solid var(--border);background:#fff;display:flex;justify-content:space-between}
  </style>
  </head>
  <body>
  <div class="app">
    <aside>
      <h1>ERP Industrial</h1>
      <nav id="nav">
        <button data-page="dashboard" class="active">Dashboard</button>
        <button data-page="produtos">Produtos</button>
        <button data-page="pmp">PMP</button>
        <button data-page="mrp">MRP</button>
        <button data-page="crp">CRP</button>
        <button data-page="estoque">Estoque</button>
        <button data-page="historico">Histórico</button>
      </nav>
      <div style="padding:20px;margin-top:20px;border-top:1px solid #1e293b">
        <button class="btn btn-secondary btn-sm" id="resetData" style="width:100%">Restaurar dados</button>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  <div class="modal-bg" id="modal"></div>
  <div class="toast-wrap" id="toasts"></div>

  <script>
  // =============== Storage ===============
  const SEED = {"products":[{"id":4,"code":"CMP-001","name":"Quadro de aço carbono","description":"Quadro soldado para bicicleta urbana.","category":"Estrutura","type":"component","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":5,"code":"CMP-002","name":"Roda 700C montada","description":"Roda completa com aro, raios e cubo.","category":"Rodas","type":"component","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":6,"code":"CMP-003","name":"Pneu 700x35C","description":"Pneu de borracha vulcanizada.","category":"Rodas","type":"component","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":7,"code":"CMP-004","name":"Câmara de ar 700C","description":"Câmara de ar com bico Schrader.","category":"Rodas","type":"component","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":8,"code":"CMP-005","name":"Selim acolchoado","description":"Selim em couro sintético.","category":"Acessórios","type":"component","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":9,"code":"CMP-006","name":"Guidão de alumínio","description":"Guidão urbano de alumínio.","category":"Estrutura","type":"component","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":10,"code":"CMP-007","name":"Quadro alumínio MTB","description":"Quadro de alumínio para MTB aro 29.","category":"Estrutura","type":"component","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":11,"code":"CMP-008","name":"Roda 29\\\" montada","description":"Roda completa MTB.","category":"Rodas","type":"component","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":12,"code":"CMP-009","name":"Pneu 29x2.10","description":"Pneu cravado para trilha.","category":"Rodas","type":"component","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":13,"code":"CMP-010","name":"Câmbio traseiro 21v","description":"Câmbio traseiro de 21 velocidades.","category":"Transmissão","type":"component","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":14,"code":"CMP-011","name":"Motor elétrico 350W","description":"Motor brushless 350W.","category":"Eletrônica","type":"component","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":15,"code":"CMP-012","name":"Bateria 36V 7.8Ah","description":"Bateria de íons de lítio.","category":"Eletrônica","type":"component","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":16,"code":"CMP-013","name":"Deck de patinete","description":"Plataforma de alumínio dobrável.","category":"Estrutura","type":"component","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":17,"code":"CMP-014","name":"Roda 8\\\" patinete","description":"Roda maciça de poliuretano.","category":"Rodas","type":"component","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":1,"code":"PRD-001","name":"Bicicleta Urbana 700C","description":"Bicicleta urbana com quadro de aço, aro 700C, 1 marcha.","category":"Bicicletas","type":"parent","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":2,"code":"PRD-002","name":"Bicicleta MTB Aro 29","description":"Mountain bike com 21 marchas e suspensão dianteira.","category":"Bicicletas","type":"parent","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"},{"id":3,"code":"PRD-003","name":"Patinete Elétrico 350W","description":"Patinete elétrico dobrável com motor de 350W.","category":"Mobilidade Urbana","type":"parent","unit":"UN","createdAt":"2026-04-29T15:30:15.988Z"}],"bom":[{"id":1,"parentProductId":1,"componentProductId":4,"quantity":1},{"id":2,"parentProductId":1,"componentProductId":5,"quantity":2},{"id":3,"parentProductId":1,"componentProductId":6,"quantity":2},{"id":4,"parentProductId":1,"componentProductId":7,"quantity":2},{"id":5,"parentProductId":1,"componentProductId":8,"quantity":1},{"id":6,"parentProductId":1,"componentProductId":9,"quantity":1},{"id":7,"parentProductId":2,"componentProductId":10,"quantity":1},{"id":8,"parentProductId":2,"componentProductId":11,"quantity":2},{"id":9,"parentProductId":2,"componentProductId":12,"quantity":2},{"id":10,"parentProductId":2,"componentProductId":7,"quantity":2},{"id":11,"parentProductId":2,"componentProductId":13,"quantity":1},{"id":12,"parentProductId":2,"componentProductId":8,"quantity":1},{"id":13,"parentProductId":3,"componentProductId":16,"quantity":1},{"id":14,"parentProductId":3,"componentProductId":17,"quantity":2},{"id":15,"parentProductId":3,"componentProductId":14,"quantity":1},{"id":16,"parentProductId":3,"componentProductId":15,"quantity":1}],"pmp":[{"id":1,"productId":1,"period":"2026-05","plannedQuantity":120,"notes":"Demanda regular varejo"},{"id":2,"productId":1,"period":"2026-06","plannedQuantity":150,"notes":"Pico Dia dos Pais"},{"id":3,"productId":2,"period":"2026-05","plannedQuantity":80,"notes":"Linha MTB"},{"id":4,"productId":2,"period":"2026-06","plannedQuantity":90,"notes":null},{"id":5,"productId":3,"period":"2026-05","plannedQuantity":200,"notes":"Lançamento patinete elétrico"}],"workCenters":[{"id":4,"name":"Eletrônica","description":"Bancada de instalação elétrica.","capacityHoursPerDay":8,"createdAt":"2026-04-29T15:30:23.500Z"},{"id":3,"name":"Montagem Final","description":"Linha de montagem manual.","capacityHoursPerDay":24,"createdAt":"2026-04-29T15:30:23.500Z"},{"id":2,"name":"Pintura","description":"Cabine de pintura eletrostática.","capacityHoursPerDay":8,"createdAt":"2026-04-29T15:30:23.500Z"},{"id":1,"name":"Soldagem","description":"Solda MIG/TIG de quadros e estruturas.","capacityHoursPerDay":16,"createdAt":"2026-04-29T15:30:23.500Z"}],"routings":[{"id":1,"productId":1,"workCenterId":1,"hoursPerUnit":0.4},{"id":2,"productId":1,"workCenterId":2,"hoursPerUnit":0.3},{"id":3,"productId":1,"workCenterId":3,"hoursPerUnit":0.6},{"id":4,"productId":2,"workCenterId":1,"hoursPerUnit":0.5},{"id":5,"productId":2,"workCenterId":2,"hoursPerUnit":0.3},{"id":6,"productId":2,"workCenterId":3,"hoursPerUnit":0.8},{"id":7,"productId":3,"workCenterId":3,"hoursPerUnit":0.5},{"id":8,"productId":3,"workCenterId":4,"hoursPerUnit":0.7}],"inventory":[{"id":1,"productId":1,"currentStock":25,"safetyStock":20,"location":"Galpão A"},{"id":2,"productId":2,"currentStock":14,"safetyStock":15,"location":"Galpão A"},{"id":3,"productId":3,"currentStock":8,"safetyStock":30,"location":"Galpão B"},{"id":4,"productId":4,"currentStock":60,"safetyStock":30,"location":"Almoxarifado 1"},{"id":5,"productId":5,"currentStock":180,"safetyStock":100,"location":"Almoxarifado 1"},{"id":6,"productId":6,"currentStock":420,"safetyStock":200,"location":"Almoxarifado 2"},{"id":7,"productId":7,"currentStock":350,"safetyStock":200,"location":"Almoxarifado 2"},{"id":8,"productId":8,"currentStock":95,"safetyStock":80,"location":"Almoxarifado 1"},{"id":9,"productId":9,"currentStock":110,"safetyStock":60,"location":"Almoxarifado 1"},{"id":10,"productId":10,"currentStock":35,"safetyStock":50,"location":"Almoxarifado 1"},{"id":11,"productId":11,"currentStock":90,"safetyStock":80,"location":"Almoxarifado 1"},{"id":12,"productId":12,"currentStock":140,"safetyStock":100,"location":"Almoxarifado 2"},{"id":13,"productId":13,"currentStock":70,"safetyStock":40,"location":"Almoxarifado 1"},{"id":14,"productId":14,"currentStock":40,"safetyStock":80,"location":"Almoxarifado 3"},{"id":15,"productId":15,"currentStock":22,"safetyStock":60,"location":"Almoxarifado 3"},{"id":16,"productId":16,"currentStock":130,"safetyStock":80,"location":"Almoxarifado 1"},{"id":17,"productId":17,"currentStock":250,"safetyStock":200,"location":"Almoxarifado 2"}],"movements":[{"id":1,"productId":6,"movementType":"in","quantity":100,"reason":"Recebimento NF 1023","createdAt":"2026-04-29T15:30:39.000Z"},{"id":2,"productId":15,"movementType":"out","quantity":12,"reason":"Consumo lote 2026-04","createdAt":"2026-04-29T15:30:39.000Z"},{"id":3,"productId":1,"movementType":"in","quantity":25,"reason":"Produção concluída","createdAt":"2026-04-29T15:30:39.000Z"},{"id":4,"productId":11,"movementType":"adjustment","quantity":90,"reason":"Inventário cíclico","createdAt":"2026-04-29T15:30:39.000Z"}]};
  const KEY = 'erp_industrial_v1';

  function loadDb() {
    try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch(e){}
    const fresh = JSON.parse(JSON.stringify(SEED));
    fresh.audit = [];
    saveDb(fresh);
    return fresh;
  }
  function saveDb(d) { localStorage.setItem(KEY, JSON.stringify(d)); }
  let db = loadDb();
  if (!db.audit) db.audit = [];

  function nextId(arr) { return arr.length ? Math.max(...arr.map(x=>x.id))+1 : 1; }
  function audit(entity, action, detail) {
    db.audit.unshift({ id: nextId(db.audit), entity, action, detail, at: new Date().toISOString() });
    if (db.audit.length > 500) db.audit.length = 500;
  }

  // =============== Helpers ===============
  const $ = (s, r=document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => Number(n||0).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  const fmtDate = s => s ? new Date(s).toLocaleString('pt-BR') : '';
  const productById = id => db.products.find(p => p.id === Number(id));
  const wcById = id => db.workCenters.find(w => w.id === Number(id));

  function toast(msg, kind='success') {
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), 2800);
  }

  function confirmDelete(label, onYes) {
    openModal({
      title: 'Confirmar exclusão',
      body: '<p>Tem certeza que deseja excluir <strong>' + esc(label) + '</strong>? Esta ação não pode ser desfeita.</p>',
      okLabel: 'Excluir',
      okClass: 'btn btn-danger',
      onOk: () => { onYes(); closeModal(); }
    });
  }

  // =============== Modal ===============
  let modalOnOk = null;
  function openModal({ title, body, okLabel='Salvar', okClass='btn', onOk, footer=true }) {
    modalOnOk = onOk;
    $('#modal').innerHTML = '<div class="modal"><div class="modal-head"><h3>' + esc(title) + '</h3><button class="icon" onclick="closeModal()">&#10005;</button></div><div class="modal-body">' + body + '</div>' + (footer ? '<div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="' + okClass + '" id="modalOk">' + esc(okLabel) + '</button></div>' : '') + '</div>';
    $('#modal').classList.add('open');
    if (footer) {
      $('#modalOk').onclick = () => { if (modalOnOk) modalOnOk(); };
    }
  }
  function closeModal() { $('#modal').classList.remove('open'); $('#modal').innerHTML=''; modalOnOk=null; }
  $('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

  // =============== Calculations ===============
  function calcMrp() {
    const totals = {};
    for (const pe of db.pmp) {
      const parentId = pe.productId;
      const qty = Number(pe.plannedQuantity) || 0;
      const items = db.bom.filter(b => b.parentProductId === parentId);
      for (const b of items) {
        const cid = b.componentProductId;
        totals[cid] = (totals[cid] || 0) + qty * Number(b.quantity || 0);
      }
    }
    const result = [];
    for (const [cid, gross] of Object.entries(totals)) {
      const prod = productById(cid);
      if (!prod) continue;
      const inv = db.inventory.find(i => i.productId === Number(cid));
      const cur = inv ? Number(inv.currentStock) : 0;
      const safe = inv ? Number(inv.safetyStock) : 0;
      const net = Math.max(0, gross - cur + safe);
      result.push({ componentCode: prod.code, componentName: prod.name, unit: prod.unit, grossRequirement: gross, currentStock: cur, safetyStock: safe, netRequirement: net });
    }
    return result.sort((a,b) => b.netRequirement - a.netRequirement);
  }

  function calcCrp() {
    const totals = {};
    for (const pe of db.pmp) {
      const qty = Number(pe.plannedQuantity) || 0;
      const rs = db.routings.filter(r => r.productId === pe.productId);
      for (const r of rs) {
        totals[r.workCenterId] = (totals[r.workCenterId] || 0) + qty * Number(r.hoursPerUnit || 0);
      }
    }
    return db.workCenters.map(w => {
      const required = totals[w.id] || 0;
      const monthly = Number(w.capacityHoursPerDay) * 22;
      const loadPercent = monthly > 0 ? (required / monthly) * 100 : 0;
      return { workCenterId: w.id, workCenterName: w.name, capacityHoursPerDay: w.capacityHoursPerDay, requiredHours: required, loadPercent: Math.round(loadPercent * 10) / 10 };
    }).sort((a,b) => b.loadPercent - a.loadPercent);
  }

  function loadColor(p) { return p >= 90 ? 'red' : p >= 75 ? 'amber' : 'green'; }

  // =============== Pages ===============
  function pageDashboard() {
    const parents = db.products.filter(p => p.type === 'parent').length;
    const components = db.products.filter(p => p.type === 'component').length;
    const totalPmp = db.pmp.reduce((s,p) => s + Number(p.plannedQuantity || 0), 0);
    const lowCount = db.inventory.filter(i => Number(i.currentStock) < Number(i.safetyStock)).length;
    const recent = db.audit.slice(0, 8);

    return `
      <div class="page-head"><div><h2>Dashboard</h2><div class="sub">Visão geral da operação industrial</div></div></div>
      <div class="grid-cards">
        <div class="stat"><div class="stat-label">Produtos Pai</div><div class="stat-val">${parents}</div></div>
        <div class="stat"><div class="stat-label">Componentes</div><div class="stat-val">${components}</div></div>
        <div class="stat"><div class="stat-label">Volume Planejado (PMP)</div><div class="stat-val">${fmt(totalPmp)}</div></div>
        <div class="stat"><div class="stat-label">Centros de Trabalho</div><div class="stat-val">${db.workCenters.length}</div></div>
        <div class="stat alert"><div class="stat-label">Alertas de Estoque</div><div class="stat-val">${lowCount}</div></div>
      </div>
      <div class="card">
        <h3>Atividade Recente</h3>
        ${recent.length === 0 ? '<div class="empty">Nenhuma atividade ainda.</div>' : '<table><thead><tr><th>Quando</th><th>Entidade</th><th>Ação</th><th>Detalhe</th></tr></thead><tbody>' + recent.map(a => '<tr><td>' + esc(fmtDate(a.at)) + '</td><td>' + esc(a.entity) + '</td><td><span class="badge badge-blue">' + esc(a.action) + '</span></td><td class="muted">' + esc(a.detail) + '</td></tr>').join('') + '</tbody></table>'}
      </div>
    `;
  }

  let prodFilter = { q: '', type: 'all' };
  function pageProdutos() {
    const list = db.products.filter(p => {
      if (prodFilter.type !== 'all' && p.type !== prodFilter.type) return false;
      if (prodFilter.q && !((p.code+' '+p.name).toLowerCase().includes(prodFilter.q.toLowerCase()))) return false;
      return true;
    });
    return `
      <div class="page-head">
        <div><h2>Produtos</h2><div class="sub">Gerencie produtos pai e componentes</div></div>
        <button class="btn" onclick="openProductForm()">+ Novo Produto</button>
      </div>
      <div class="card">
        <div class="toolbar">
          <input class="search" placeholder="Buscar por código ou nome..." value="${esc(prodFilter.q)}" oninput="prodFilter.q=this.value;render()">
          <select style="max-width:180px" onchange="prodFilter.type=this.value;render()">
            <option value="all" ${prodFilter.type==='all'?'selected':''}>Todos os tipos</option>
            <option value="parent" ${prodFilter.type==='parent'?'selected':''}>Produto Pai</option>

        const data = { productId: pid, currentStock: Number($('#f_cur').value)||0, safetyStock: Number($('#f_safe').value)||0, location: $('#f_loc').value.trim() };
        const p = productById(pid);
        if (id) { Object.assign(i, data); audit('Estoque', 'atualizar', p?.code); }
        else {
          const dup = db.inventory.find(x => x.productId === pid);
          if (dup) { toast('Produto já tem posição cadastrada.', 'error'); return; }
          db.inventory.push({ id: nextId(db.inventory), ...data });
          audit('Estoque', 'criar', p?.code);
        }
        saveDb(db); closeModal(); toast('Posição salva.'); render();
      }
    });
  }
  function deleteInv(id) {
    const i = db.inventory.find(x => x.id === id); if (!i) return;
    const p = productById(i.productId);
    confirmDelete(p?.code, () => {
      db.inventory = db.inventory.filter(x => x.id !== id);
      audit('Estoque', 'excluir', p?.code);
      saveDb(db); toast('Posição excluída.'); render();
    });
  }
  function openMovForm() {
    openModal({
      title: 'Registrar Movimentação',
      body: `
        <div class="field"><label>Produto *</label><select id="f_prod"><option value="">— escolha —</option>${db.products.map(p => `<option value="${p.id}">${esc(p.code)} — ${esc(p.name)}</option>`).join('')}</select></div>
        <div class="field-row"><div class="field"><label>Tipo *</label><select id="f_type"><option value="in">Entrada</option><option value="out">Saída</option><option value="adjustment">Ajuste</option></select></div>
        <div class="field"><label>Quantidade *</label><input id="f_qty" type="number" step="1"></div></div>
        <div class="field"><label>Motivo</label><input id="f_reason" placeholder="Ex: Recebimento NF 1023"></div>
      `,
      onOk: () => {
        const pid = Number($('#f_prod').value), tp = $('#f_type').value, qty = Number($('#f_qty').value);
        if (!pid || !qty) { toast('Preencha produto e quantidade.', 'error'); return; }
        const reason = $('#f_reason').value.trim();
        db.movements.push({ id: nextId(db.movements), productId: pid, movementType: tp, quantity: qty, reason, createdAt: new Date().toISOString() });
        let inv = db.inventory.find(x => x.productId === pid);
        if (!inv) { inv = { id: nextId(db.inventory), productId: pid, currentStock: 0, safetyStock: 0, location: '' }; db.inventory.push(inv); }
        if (tp === 'in') inv.currentStock = Number(inv.currentStock) + qty;
        else if (tp === 'out') inv.currentStock = Math.max(0, Number(inv.currentStock) - qty);
        else inv.currentStock = qty;
        const p = productById(pid);
        audit('Movimentação', tp==='in'?'entrada':tp==='out'?'saída':'ajuste', (p?.code||'') + ' (' + qty + ')');
        saveDb(db); closeModal(); toast('Movimentação registrada.'); render();
      }
    });
  }

  function pageHistorico() {
    return `
      <div class="page-head"><div><h2>Histórico</h2><div class="sub">Auditoria de todas as ações no sistema</div></div></div>
      <div class="card">
        ${db.audit.length === 0 ? '<div class="empty">Nenhum registro ainda.</div>' : `<table><thead><tr><th>Quando</th><th>Entidade</th><th>Ação</th><th>Detalhe</th></tr></thead><tbody>${db.audit.map(a => `<tr>
          <td>${esc(fmtDate(a.at))}</td>
          <td>${esc(a.entity)}</td>
          <td><span class="badge badge-blue">${esc(a.action)}</span></td>
          <td class="muted">${esc(a.detail)}</td>
        </tr>`).join('')}</tbody></table>`}
      </div>
    `;
  }

  // =============== Router ===============
  let currentPage = 'dashboard';
  const PAGES = { dashboard: pageDashboard, produtos: pageProdutos, pmp: pagePmp, mrp: pageMrp, crp: pageCrp, estoque: pageEstoque, historico: pageHistorico };
  function render() {
    $('#main').innerHTML = (PAGES[currentPage] || pageDashboard)();
    document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.page === currentPage));
  }
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { currentPage = b.dataset.page; render(); });
  $('#resetData').onclick = () => {
    if (confirm('Restaurar os dados iniciais? Suas alterações serão perdidas.')) {
      localStorage.removeItem(KEY); db = loadDb(); db.audit = []; saveDb(db); render(); toast('Dados restaurados.');
    }
  };
  render();
  </script>
  </body>
  </html>
